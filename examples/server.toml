# tmuxlet-server example config. Default path: ~/.tmuxlet/server.toml
# Override with: tmuxlet-server --config FILE

[server]
listen = "127.0.0.1:3456"
default_chain = "default"
request_timeout_secs = 1800          # server-wide default; tmuxlet/cli coding turns run minutes
# env_source = "shell" runs `$SHELL -ilc env` at startup (~1s with a heavy
# interactive zsh) so PATH entries exported in ~/.zshrc (e.g. agy) are visible
# to spawned backends. Use "process" to skip that and inherit the current env.
env_source = "shell"
log_level = "info"                   # error | warn | info | debug

# ── Backends ────────────────────────────────────────────────────────────────

[backends.agy]
type = "cli"
bin = "/Users/kk/.antigravity/antigravity/bin/agy"   # NOTE: a symlink into Antigravity.app — must be installed
# `{prompt}` is substituted with the request prompt. agy's `--print`/`-p` flag
# takes the prompt as its VALUE, so it must land in argv — not on stdin. Omit
# the placeholder and the prompt is instead appended as a trailing positional
# (non-PTY) or written to the child's stdin (PTY).
args = ["-p", "{prompt}"]
pty = true                           # agy detects non-TTY and redirects output; needs a PTY

[backends.ollama-kimi]
type = "api"
base_url = "http://127.0.0.1:11434/v1"
model = "kimi-k2.6:cloud"
extra_body = { think = true }        # shallow-merged into the request body
timeout_secs = 120                   # api backends can fail fast

[backends.openrouter-sonnet]
type = "api"
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-4.6"
api_key_env = "OPENROUTER_API_KEY"   # env var NAME, not the key itself
timeout_secs = 120

[backends.claude-thinking]
type = "tmuxlet"
target = "claude"
target_args = ["--effort", "max"]    # passed through as repeated --target-arg
cwd = "~"

# ── Chains ──────────────────────────────────────────────────────────────────
# Ordered fallback lists. The request `model` selects a chain or a single
# backend; anything unmatched falls back to server.default_chain.

[chains.default]
order = ["agy", "ollama-kimi", "claude-thinking"]

[chains.thinking]
order = ["claude-thinking", "agy"]

# ══════════════════════════════════════════════════════════════════════════════
# Reference — every optional key with its default. Everything below is COMMENTED
# OUT: the happy path above stays minimal (UX invariant 4). Uncomment and adjust.
# ══════════════════════════════════════════════════════════════════════════════

# ── [server] optional keys ──────────────────────────────────────────────────
# request_timeout_secs = 1800       # per-leg dispatch timeout (tmuxlet/cli run minutes)
# env_source = "shell"              # "shell" (run $SHELL -ilc env) | "process"
# log_level = "info"                # error | warn | info | debug
# env_capture_timeout_secs = 15     # S-9 watchdog bounding the shell env capture
# auth = false                      # S-1: require a bearer token on /v1/* (not /health)
# auth_token_env = "TMUXLET_TOKEN"  # read the token from this env var (wins over the file);
#                                   #   when auth=true and this is unset, a token is
#                                   #   generated once into ~/.tmuxlet/token (0600)
# env_pass = ["OPENAI_*", "AWS_*"]  # S-3: server-wide env allowlist (globs) for backends
# max_response_bytes = 67108864     # S-5: cap on a single upstream (api) response body
# workers = 16                      # P-1: worker threads (default max(16, cores))
# chain_budget_secs = 120           # P-6: total time budget across a chain's legs
# cooldown = true                   # P-9: enable failure-aware backend cooldown
# cooldown_secs = 60                # P-9: base cooldown for rate-limit / http failures
# strict_models = false             # U-3: reject unknown models (404) vs fall back to default_chain
# cors_origins = ["http://localhost:5173"]  # U-10: browser CORS allowlist (exact origins; no wildcard)
# classifier_include_opening = true # §4.2: show the classifier the opening task
#                                   #   AND the latest turn (60/40 char split),
#                                   #   not just the latest turn — which on turn 12
#                                   #   of an agent run is "yes, continue".
#                                   #   Server-wide (the only classifier key that
#                                   #   is not per-router); false = v0.2.0 behavior.
# metrics = false                   # §5.3: expose /metrics (Prometheus text 0.0.4).
#                                   #   Off by default; gated by `auth` like /v1/*.
# session_max = 4096                # §6.2: hard cap on the session map. A client-
#                                   #   supplied session header keying an unbounded
#                                   #   map is a memory-exhaustion vector, so the
#                                   #   oldest entry is evicted at the limit.
# session_ttl_secs = 7200           # §6.2: how long session state survives idle

# ── Per-backend optional keys ───────────────────────────────────────────────
# All backend types:
#   allow_empty = false             # U-6: accept an empty completion as success
#   max_concurrent = 1              # U-20: cap simultaneous dispatches (saturated → Busy → next leg)
#
# type = "tmuxlet":
#   target_args = ["--effort", "max"]   # passed through as repeated --target-arg
#   cwd = "~"                       # working dir (tilde-expanded; default $HOME)
#   env_pass = ["FOO_*"]            # S-3: per-backend env allowlist (overrides server default)
#   prompt_mode = "transcript"      # U-14: transcript (default) | last_user
#
# type = "api":
#   api_key_env = "OPENROUTER_API_KEY"  # env var NAME holding the key (never the key itself)
#   extra_body = { think = true }   # shallow-merged into the upstream request body
#   timeout_secs = 120              # per-backend dispatch timeout override
#   ca_file = "~/.tmuxlet/lan-ca.pem"   # U-24: extra CA PEM trusted for this upstream's TLS
#
# type = "cli":
#   args = ["-p", "{prompt}"]       # {prompt} placeholder lands the prompt in argv
#   pty = false                     # U-11/U-12: run under a PTY (TTY-detecting tools)
#   pty_size = [200, 50]            # U-12: [cols, rows] when pty = true
#   cwd = "~"                       # working dir (tilde-expanded; default $HOME)
#   env_pass = ["FOO_*"]            # S-3: per-backend env allowlist
#   stdin_prompt = false            # S-4: write the prompt to stdin instead of argv
#   prompt_mode = "transcript"      # U-14: transcript (default) | last_user
#
# S-4 caveat: a prompt placed in argv is visible in `ps`; prefer stdin_prompt (cli)
# or tmuxlet's stdin form for sensitive prompts.

# ── [routers.<name>] — §5 auto-router (fully opt-in; omit for no routing) ────
# [routers.smart]
#   classifier = "ollama-kimi"      # a defined backend that labels the task
#   fallback_class = "execution"    # class used when classification fails / times out
#   classifier_timeout_secs = 5     # classifier dispatch timeout
#   classifier_max_chars = 4000     # budget for the whole classifier input (see
#                                   #   classifier_include_opening in [server] above), in chars
#   classifier_prompt = "..."       # override the default classify prompt ({classes}/{input})
#   session_affinity = true         # §6.3: reuse this conversation's first decision
#                                   #   on later turns and skip the classifier call.
#                                   #   Engages only when the client sends one of:
#                                   #   x-tmuxlet-session-id, x-claude-code-session-id,
#                                   #   x-session-id, x-conversation-id
#   message_hash_fallback = false   # §6.1: with no session header, key on a hash of
#                                   #   the opening user message. Opt-in: it collides
#                                   #   across conversations that open identically.
#   [routers.smart.routes]          # class -> chain or backend
#   research = "thinking"
#   execution = "default"
#
# Observability: the response carries `x-tmuxlet-route: class/chain/backend`, and
# GET /v1/backends shows per-backend health (state ok|cooling|busy|unknown).
