[package]
name = "tmuxlet-server"
version = "0.2.0"
edition = "2024"
description = "OpenAI-compatible HTTP server fronting tmuxlet, CLI tools, and API upstreams via a configurable fallback chain"
license = "MIT"
repository = "https://github.com/CodefiLabs/tmuxlet-server"

[[bin]]
name = "tmuxlet-server"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.7"
portable-pty = "0.9.0"
# Already in the tree via portable-pty; declared directly only to disable PTY
# echo (termios) so captured backend output isn't polluted by echoed stdin.
# `term` disables PTY echo; `signal` registers the U-22 SIGHUP reload handler.
# Both are features of a crate already in the tree via portable-pty — no new
# dependency, which §0 of the v2 spec makes a hard constraint.
nix = { version = "0.28", features = ["term", "signal"] }

[dev-dependencies]
# Test-only HTTP client (auto-dechunks SSE responses). http-only: no TLS needed
# for localhost integration tests, and dev-deps don't affect the shipped binary.
ureq = { version = "2", default-features = false }
tempfile = "3"
